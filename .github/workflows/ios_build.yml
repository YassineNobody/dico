name: Build iOS IPA (no codesign)

on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ⚠️ Installer FVM
      - name: Install FVM
        run: dart pub global activate fvm

      # ⚠️ Installer Flutter 3.27.1 via FVM
      - name: Install Flutter 3.27.1
        run: fvm install 3.27.1

      # ⚠️ Dire à FVM d'utiliser cette version dans le projet
      - name: Use Flutter 3.27.1
        run: fvm use 3.27.1

      # ⚠️ Ajouter Flutter au PATH
      - name: Add Flutter to PATH
        run: echo "$HOME/fvm/versions/3.27.1/bin" >> $GITHUB_PATH

      # ⚠️ Clean + Pub get
      - name: Get packages
        run: |
          fvm flutter clean
          fvm flutter pub get

      # ⚠️ Build IPA
      - name: Build iOS IPA (unsigned)
        run: |
          fvm flutter build ipa --release --no-codesign

      # ⚠️ Upload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/Runner.ipa
