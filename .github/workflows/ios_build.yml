name: Build iOS IPA (no codesign)

on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Étape 1 : Installer Flutter 3.27.1
      - name: Download Flutter SDK (3.27.1)
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.27.1
          echo "$PWD/flutter/bin" >> $GITHUB_PATH

      # Étape 2 : Vérifier que Flutter est dispo (PATH appliqué)
      - name: Flutter version
        run: flutter --version

      # Pub get
      - name: Pub get
        run: flutter pub get

      # Clean iOS
      - name: Flutter clean
        run: flutter clean

      # Build IPA
      - name: Build iOS IPA
        run: flutter build ipa --release --no-codesign

      # Upload artifact
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/Runner.ipa
