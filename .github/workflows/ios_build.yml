name: Build Flutter iOS (manual install, no codesign)

on:
  workflow_dispatch:   # ➜ Permet de lancer le build manuellement

jobs:
  build:
    runs-on: macos-13   # Mac moderne compatible Xcode 15+

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # 🧩 Installer Flutter 3.27.1 (compatible Dart 3.9+)
      - name: Install Flutter manually
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.27.1
          echo "$PWD/flutter/bin" >> $GITHUB_PATH
          flutter --version
          dart --version

      - name: Flutter pub get
        run: |
          flutter pub get

      # 🛠 Construire l’IPA sans signature (no codesign)
      - name: Build iOS IPA (unsigned)
        run: |
          flutter build ipa --release --no-codesign

      # ⬆️ Upload Runner.ipa pour téléchargement
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/Runner.ipa
