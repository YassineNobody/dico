name: Build Flutter iOS (manual install, no codesign)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Flutter 3.27.1
        shell: bash
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.27.1
          echo "$PWD/flutter/bin" >> $GITHUB_PATH
          flutter --version
          dart --version

      - name: Flutter pub get
        shell: bash
        run: flutter pub get

      - name: Build iOS IPA (unsigned)
        shell: bash
        run: flutter build ipa --release --no-codesign

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/Runner.ipa
