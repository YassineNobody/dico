name: Build iOS IPA (no codesign)

on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installer Flutter 3.27.1 manuellement
      - name: Install Flutter 3.27.1
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.27.1
          echo "$PWD/flutter/bin" >> $GITHUB_PATH
          flutter --version

      # Récupérer les dépendances
      - name: Pub get
        run: flutter pub get

      # Nettoyer iOS
      - name: Flutter clean
        run: flutter clean

      # Build IPA sans signature
      - name: Build iOS IPA
        run: flutter build ipa --release --no-codesign

      # Upload artefact IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/Runner.ipa
